<div>
  <p class="mat-headline-medium text-on-surface w-full m-0">
    {{ 'settings.title' | translate }}
  </p>
</div>

<!-- Tabs -->
<mat-tab-group mat-align-tabs="start" mat-stretch-tabs="false" class="overflow-hidden mt-7" animationDuration="0ms">
  <!-- Profile -->
  <mat-tab [label]="'settings.profileTab' | translate">
    <div class="pt-[28px]">
    <app-user-profile></app-user-profile>
    </div>
  </mat-tab>

  <!-- Organization -->
  <mat-tab [label]="'settings.restaurantTab' | translate">
    <div class="pt-[28px]">
      <app-organization-profile></app-organization-profile>
    </div>
  </mat-tab>

  <!-- Team -->
  <mat-tab [label]="'settings.teamTab' | translate">
    <div class="pt-[28px]">
      <app-team-users></app-team-users>
    </div>
  </mat-tab>

</mat-tab-group>
