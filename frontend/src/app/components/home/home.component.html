<div class="flex flex-col min-h-screen">
    <app-header class="fixed top-0 left-0 w-full z-50"></app-header>

    <div class="flex flex-1">
        <!-- Sidenav: sticky bottom bar on mobile/tablet, fixed sidebar on large screens -->
        <app-sidenav class="
            fixed bottom-0 left-0 w-full z-40
            lg:top-[80px] lg:bottom-auto lg:left-0 lg:w-[312px] lg:h-[calc(100vh-5rem)]
        "></app-sidenav>

        <!-- Main content area — top margin matches header height; bottom padding clears bottom nav + 16px separation gap on mobile -->
        <div class="
            flex-1 min-w-0 w-full
            mt-[64px] pb-[80px]
            px-4 py-5
            sm:mt-[80px] sm:px-6 sm:py-6 sm:pb-[96px]
            lg:ml-[312px] lg:px-[48px] lg:py-[40px]
            lg:h-[calc(100vh-5rem)] lg:overflow-y-auto
        ">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
