<div>
  <div class="!w-[312px]" disableClose>
    <div class="pt-[30px] pr-[16px] pl-[16px] pb-[12px]">
      <mat-nav-list class="cursor-pointer flex flex-col gap-[4px]">
        <a routerLink="./dashboard" routerLinkActive #dashboard="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: false }">
          <mat-list-item [activated]="dashboard.isActive">
            <mat-icon matListItemIcon class="material-symbols-outlined text-on-surface">
              dashboard_2
            </mat-icon>
            <div matListItemTitle class="mat-label-large" [ngClass]="{ 'font-semibold': dashboard.isActive }">
              Dashboard
            </div>
          </mat-list-item>
        </a>

        <a routerLink="./offers" routerLinkActive #offers="routerLinkActive">
          <mat-list-item [activated]="offers.isActive">
            <mat-icon matListItemIcon class="material-symbols-outlined text-on-surface"> local_activity </mat-icon>
            <div matListItemTitle class="mat-label-large" [ngClass]="{ 'font-semibold': offers.isActive }">
              Offers
            </div>
          </mat-list-item>
        </a>

        <a routerLink="./redemptions" routerLinkActive #redemptions="routerLinkActive">
          <mat-list-item [activated]="redemptions.isActive">
            <mat-icon matListItemIcon class="material-symbols-outlined text-on-surface"> receipt_long </mat-icon>
            <div matListItemTitle class="mat-label-large" [ngClass]="{ 'font-semibold': redemptions.isActive }">
              Redemptions
            </div>
          </mat-list-item>
        </a>

        <a routerLink="./redeem" routerLinkActive #redeem="routerLinkActive">
          <mat-list-item [activated]="redeem.isActive">
            <mat-icon matListItemIcon class="material-symbols-outlined text-on-surface">qr_code_scanner</mat-icon>
            <div matListItemTitle class="mat-label-large" [ngClass]="{ 'font-semibold': redeem.isActive }">
              Redeem offer
            </div>
          </mat-list-item>
        </a>

        <a routerLink="./settings" routerLinkActive #settings="routerLinkActive">
          <mat-list-item [activated]="settings.isActive">
            <mat-icon matListItemIcon class="material-symbols-outlined text-on-surface">settings</mat-icon>
            <div matListItemTitle class="mat-label-large" [ngClass]="{ 'font-semibold': settings.isActive }">
              Settings
            </div>
          </mat-list-item>
        </a>
      </mat-nav-list>
    </div>
  </div>
</div>
