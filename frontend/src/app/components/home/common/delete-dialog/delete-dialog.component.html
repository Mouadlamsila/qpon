<div class="w-full max-w-[448px] p-4 sm:p-6">
  <div class="flex flex-col gap-6">
    <div class="flex flex-col gap-2">
      <div class="mat-title-medium text-on-surface break-all">
        {{ data.title }}
      </div>
      <div class="mat-body-medium text-on-surface-variant">
        {{ data.description }}
      </div>
    </div>
    <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <button mat-button mat-dialog-close class="w-full sm:w-auto">Cancel</button>
      <button
        mat-flat-button
        class="rounded-full bg-error w-full sm:w-auto"
        (click)="
          data.onDelete()
        "
      >
        {{ data.buttonText || 'Delete' }}
      </button>
    </div>
  </div>
</div>
